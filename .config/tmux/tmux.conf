# tmux 3.6+, no plugin manager and no plugins.
# Colours are terminal palette names (blue, magenta, brightblack...): Ghostty
# maps them to Rosé Pine or Rosé Pine Dawn, so the bar follows light/dark live.

# --- Prefix -----------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Terminal ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"   # true colour for nvim
set -g focus-events on                           # nvim notices focus changes
set -g extended-keys on                          # pass modified keys to apps
set -g set-titles on                             # window title: session and program
set -g set-titles-string "#S: #W"

# --- Behaviour --------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g renumber-windows on
setw -g aggressive-resize on
set -s copy-command "pbcopy"
set -g status-keys emacs    # command prompt stays emacs-style...
setw -g mode-keys vi        # ...copy mode uses vim keys

# Copy mode like vim: v to select, y to copy to the macOS clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Mouse wheel: one line per notch in copy mode
bind -T copy-mode-vi WheelUpPane send -N1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N1 -X scroll-down

# New panes and windows open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# --- Look -------------------------------------------------------------------
set -g status-interval 5
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=magenta,bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=brightblack]#{b:pane_current_path} "
set -g status-right-length 100
setw -g window-status-separator ""
setw -g window-status-format "#[fg=brightblack] #I #W "
setw -g window-status-current-format "#[fg=blue,bold] #I #W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=yellow"
