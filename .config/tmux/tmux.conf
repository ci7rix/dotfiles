# tmux 3.6+, no plugin manager and no plugins.

# --- Prefix -----------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Terminal ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"   # true colour for nvim
set -g focus-events on                           # nvim notices focus changes
set -g extended-keys on                          # pass modified keys to apps
set -g set-titles on                             # window title: session and program
set -g set-titles-string "#S: #W"

# --- Behaviour --------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g renumber-windows on
set -g base-index 1          # windows and panes start at 1, like the keyboard
setw -g pane-base-index 1
setw -g aggressive-resize on
set -s copy-command "pbcopy"
set -g status-keys emacs    # command prompt stays emacs-style...
setw -g mode-keys vi        # ...copy mode uses vim keys

# Copy mode like vim: v to select, y to copy to the macOS clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Mouse wheel: one line per notch in copy mode
bind -T copy-mode-vi WheelUpPane send -N1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N1 -X scroll-down

# --- Keys -------------------------------------------------------------------
# Only keys typed without Option on a Swiss French keyboard.
# Prefix then Space shows the menu below; prefix then ? lists every key.
bind -N "Split top/bottom"   - split-window -v -c "#{pane_current_path}"
bind -N "Split side by side" v split-window -h -c "#{pane_current_path}"
bind -N "New window"         c new-window -c "#{pane_current_path}"
bind -N "Pane on the left"   h select-pane -L
bind -N "Pane below"         j select-pane -D
bind -N "Pane above"         k select-pane -U
bind -N "Pane on the right"  l select-pane -R
bind -N "Copy mode"          Escape copy-mode
bind -N "Reload the config"  r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# Cheat sheet: choose an entry, or just read it and press q.
# Dim lines are reminders of keys used outside the menu.
bind -N "Show this menu" Space display-menu -T "#[align=centre] Ctrl+Space then " -x C -y C \
  "Split top/bottom"   - "split-window -v -c '#{pane_current_path}'" \
  "Split side by side" v "split-window -h -c '#{pane_current_path}'" \
  "New window"         c "new-window -c '#{pane_current_path}'" \
  "Zoom pane"          z "resize-pane -Z" \
  "Close pane"         x "confirm-before -p 'Close this pane? (y/n)' kill-pane" \
  "Rename window"      , "command-prompt -I '#W' 'rename-window -- \"%%\"'" \
  "Choose a session or window" w "choose-tree -Zw" \
  "Detach"             d "detach-client" \
  "Reload the config"  r "source-file ~/.config/tmux/tmux.conf" \
  "All keys"           ? "list-keys -N" \
  "" \
  "-Pane: h j k l        Window: 1 to 9" "" "" \
  "-Copy: Esc, then v to select and y to copy" "" ""

# --- Look -------------------------------------------------------------------
# Windows on the left, active one in pink; machine name on the right
set -g status-style "bg=default,fg=default"
set -g status-left ""
set -g status-right "#{host_short}"
setw -g window-status-format "#I #W#{?window_zoomed_flag, Z,}"
setw -g window-status-current-format "#I #W#{?window_zoomed_flag, Z,}"
setw -g window-status-current-style "fg=red,nounderscore"   # "red" is Rose Pine pink (love), readable in light and dark
setw -g window-status-separator "  "
