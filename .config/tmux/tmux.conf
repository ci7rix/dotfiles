# tmux 3.6+, no plugin manager and no plugins.

# --- Prefix -----------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Terminal ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"   # true colour for nvim
set -g focus-events on                           # nvim notices focus changes
set -g extended-keys on                          # pass modified keys to apps
set -g set-titles on                             # window title: session and program
set -g set-titles-string "#S: #W"

# --- Behaviour --------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g renumber-windows on
set -g base-index 1          # windows and panes start at 1, like the keyboard
setw -g pane-base-index 1
setw -g aggressive-resize on
set -s copy-command "pbcopy"
set -g status-keys emacs    # command prompt stays emacs-style...
setw -g mode-keys vi        # ...copy mode uses vim keys

# Copy mode like vim: v to select, y to copy to the macOS clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Mouse wheel: one line per notch in copy mode
bind -T copy-mode-vi WheelUpPane send -N1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N1 -X scroll-down

# New panes and windows open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# --- Look -------------------------------------------------------------------
# Windows only, in terminal colours: "1 fish  2 nvim", active one in green
set -g status-style "bg=default,fg=default"
set -g status-left ""
set -g status-right "#{=21:pane_title}"   # pane title, without the default quotes
setw -g window-status-format "#I #W#{?window_zoomed_flag, Z,}"
setw -g window-status-current-format "#I #W#{?window_zoomed_flag, Z,}"
setw -g window-status-current-style "fg=green,nounderscore"
setw -g window-status-separator "  "
