# [bootstrap.settings] needs this release: an older mise says to update
# instead of only warning about an unknown field
min_version = { soft = "2026.11.8" }

[settings]
dotfiles.root = "~/Developer/github.com/ci7rix/dotfiles"   # = REPO_DIR in bootstrap.sh
experimental = true   # mise bootstrap is still experimental upstream

# `mise use -g` and `mise bootstrap packages use -g` write where this repo keeps
# tools and packages, never in this file
[settings.write_targets]
tools = "~/.config/mise/conf.d/30-tools.toml"
packages = "~/.config/mise/conf.d/10-homebrew.toml"

[bootstrap.user]
login_shell = "fish"

# Linked from this repo (same path under dotfiles.root).
# variants = [{ os = "macos" }]: macOS apps, not linked on Linux
[dotfiles]
"~/.config/atuin/config.toml" = {}
"~/.config/fish/config.fish" = {}
"~/.config/fish/fish_plugins" = {}
"~/.config/ghostty" = { variants = [{ os = "macos" }] }
"~/.config/git/config" = {}
"~/.config/git/ignore" = {}
"~/.config/karabiner" = { variants = [{ os = "macos" }] }
"~/.config/nvim" = {}
"~/.config/omniwm" = { variants = [{ os = "macos" }] }
"~/.config/starship" = {}
"~/.config/tmux" = {}
"~/.config/zed/settings.json" = { variants = [{ os = "macos" }] }
# "docker compose" without the hyphen: the Homebrew binary as a docker CLI plugin
# (on Linux, apt:docker-compose installs the plugin itself)
"~/.docker/cli-plugins/docker-compose" = { source = "/opt/homebrew/opt/docker-compose/bin/docker-compose", variants = [{ os = "macos" }] }
