# mise installs the packages below by itself. Homebrew is only added for its
# own commands (brew uninstall, brew services...), if it is missing.
[bootstrap.hooks.pre-packages]
run = '''
if ! command -v brew >/dev/null 2>&1 && [ ! -x /opt/homebrew/bin/brew ]; then
  sudo -v
  NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
fi
'''

[bootstrap.packages]
# Command-line tools
"brew:age" = "latest"
"brew:age-plugin-se" = { os = "macos" }
"brew:aria2" = "latest"
"brew:carapace" = "latest"
"brew:colima" = "latest"
"brew:docker" = "latest"
"brew:docker-compose" = "latest"
