# macOS only: on Linux the same tools come from mise ([tools] in 30-tools.toml)
# and apt (15-apt.toml). Every entry here says os = "macos", or mise would
# install it on Linux too, with its own Homebrew.
#
# mise installs the packages below by itself. Homebrew is only added for its
# own commands (brew uninstall, brew services...), if it is missing.
[bootstrap.hooks.pre-packages]
run = '''
[ "$(uname)" = "Darwin" ] || exit 0
if ! command -v brew >/dev/null 2>&1 && [ ! -x /opt/homebrew/bin/brew ]; then
  sudo -v
  NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
fi
'''

# Done by Homebrew itself, after the packages below:
# - Colima runs as a Homebrew service: started now and at every login
# - apps from other taps, which mise cannot read without Ruby 3:
#   Homebrew installs them with its own Ruby (NetBird, topf from PostFinance)
[bootstrap.hooks.post-packages]
run = '''
[ "$(uname)" = "Darwin" ] || exit 0
brew="$(command -v brew || echo /opt/homebrew/bin/brew)"
"$brew" list --cask netbird-ui >/dev/null 2>&1 || "$brew" install --cask netbirdio/tap/netbird-ui
"$brew" list --cask topf >/dev/null 2>&1 || "$brew" install --cask postfinance/tap/topf
if ! "$brew" services list | awk '$1 == "colima" && $2 == "started" { found = 1 } END { exit !found }'; then
  "$brew" services start colima
fi
'''

[bootstrap.packages]
