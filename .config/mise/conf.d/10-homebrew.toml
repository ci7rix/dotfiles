"brew:ghq" = "latest"
"brew:git" = "latest"
"brew:helm" = "latest"
"brew:kind" = "latest"
"brew:kubernetes-cli" = "latest"
"brew:neovim" = "latest"
"brew:nmap" = "latest"
"brew:pam-reattach" = { os = "macos" }
"brew:picocom" = "latest"
"brew:rclone" = "latest"
"brew:sops" = "latest"
