# Tools whose version mise manages
[tools]
python = "latest"
powershell = "latest"
node = "latest"

# Linux only: the command-line tools that macOS gets from Homebrew
# (10-homebrew.toml). The rest comes from apt (15-apt.toml).
age = { version = "latest", os = "linux" }
"aqua:cilium/hubble" = { version = "latest", os = "linux" }
"aqua:fluxcd/flux2" = { version = "latest", os = "linux" }
atuin = { version = "latest", os = "linux" }
carapace = { version = "latest", os = "linux" }
cilium-cli = { version = "latest", os = "linux" }
fd = { version = "latest", os = "linux" }
fzf = { version = "latest", os = "linux" }
gh = { version = "latest", os = "linux" }
ghq = { version = "latest", os = "linux" }
"github:cloudnative-pg/cloudnative-pg" = { version = "latest", os = "linux", asset_pattern = 'kubectl-cnpg_*_linux_{{ arch(x64="x86_64") }}.tar.gz', bin = "kubectl-cnpg" }
helm = { version = "latest", os = "linux" }
jq = { version = "latest", os = "linux" }
kind = { version = "latest", os = "linux" }
kubectl = { version = "latest", os = "linux" }
neovim = { version = "latest", os = "linux" }   # 0.12+ for vim.pack: apt's is too old
rclone = { version = "latest", os = "linux" }
restic = { version = "latest", os = "linux" }
ripgrep = { version = "latest", os = "linux" }
shellcheck = { version = "latest", os = "linux" }
sops = { version = "latest", os = "linux" }
starship = { version = "latest", os = "linux" }
talosctl = { version = "latest", os = "linux" }
tmux = { version = "latest", os = "linux" }      # 3.6+ for tmux.conf: apt's is too old
yq = { version = "latest", os = "linux" }
zoxide = { version = "latest", os = "linux" }
