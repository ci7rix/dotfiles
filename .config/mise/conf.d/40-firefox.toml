# Firefox, set up through its policies: they are read from the preferences of
# this user (domain org.mozilla.firefox). Restart Firefox after `mise run apply`,
# then about:policies shows what is active and any error.
[bootstrap.macos.defaults."org.mozilla.firefox"]
EnterprisePoliciesEnabled = true   # without it Firefox ignores everything below

# Passwords and forms: only the password manager extension, never Firefox itself
PasswordManagerEnabled = false
OfferToSaveLogins = false
AutofillAddressEnabled = false
AutofillCreditCardEnabled = false

# Extensions, one per line. The ID is in about:support > Add-ons.
# normal_installed: installed automatically, can still be disabled in Firefox.
[bootstrap.macos.defaults."org.mozilla.firefox".ExtensionSettings]
"uBlock0@raymondhill.net"                = { installation_mode = "normal_installed" }   # uBlock Origin
"sponsorBlocker@ajay.app"                = { installation_mode = "normal_installed" }   # SponsorBlock
"{446900e4-71c2-419f-a6a7-df9c091e268b}" = { installation_mode = "normal_installed" }   # Bitwarden
"{762f9885-5a13-4abd-9c77-433dcd38b8fd}" = { installation_mode = "normal_installed" }   # Return YouTube Dislike
"{f0bda7ce-0cda-42dc-9ea8-126b20fed280}" = { installation_mode = "normal_installed" }   # Hister
"firefox-extension@shodan.io"            = { installation_mode = "normal_installed" }   # Shodan
"FirefoxColor@mozilla.com"               = { installation_mode = "normal_installed" }   # Firefox Color

# Layout, as defaults: still changeable in Firefox, and what a new profile starts with.
# To change it: arrange the toolbars in Firefox, then copy the value of
# browser.uiCustomization.state from about:config between the single quotes.
[bootstrap.macos.defaults."org.mozilla.firefox".Preferences]
"sidebar.revamp"                = { Status = "default", Value = true }
"sidebar.verticalTabs"          = { Status = "default", Value = true }
