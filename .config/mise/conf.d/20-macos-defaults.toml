# Machine name = model + serial number. Only changed (and sudo asked) when it differs.
[bootstrap.hooks.pre-defaults]
run = '''
if [ "$(uname)" = "Darwin" ]; then
  model=$(system_profiler SPHardwareDataType | awk -F': ' '/Model Name/{print $2}' | tr -d ' ')
  serial=$(system_profiler SPHardwareDataType | awk -F': ' '/Serial Number \(system\)/{print $2}')
  name="$model-$serial"
  for key in ComputerName HostName LocalHostName; do
    [ "$(scutil --get "$key" 2>/dev/null)" = "$name" ] || sudo scutil --set "$key" "$name"
  done
fi
'''

[bootstrap.hooks.post-defaults]
run = '''
if [ "$(uname)" = "Darwin" ]; then
  # Screenshot folder: written here so that $HOME is expanded by the shell
  mkdir -p "$HOME/Pictures/Screenshots"
  defaults write com.apple.screencapture location -string "$HOME/Pictures/Screenshots"
  # Only when this file has changed since the last run:
  state="$HOME/.local/state/dotfiles/macos-defaults.sha"
  sum=$(shasum "$HOME/.config/mise/conf.d/20-macos-defaults.toml" | cut -d' ' -f1)
  if [ "$(cat "$state" 2>/dev/null)" != "$sum" ]; then
    # per-folder view settings (.DS_Store) override the Finder defaults: drop them
    find "$HOME/Desktop" "$HOME/Documents" "$HOME/Downloads" -name .DS_Store -delete 2>/dev/null || true
    # Finder, the Dock, the menu bar and the desktop keep their preferences in memory: restart them
    killall Finder Dock SystemUIServer WindowManager 2>/dev/null || true
    # trackpad and keyboard settings: make macOS reload them without a logout
    /System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u 2>/dev/null || true
    mkdir -p "$(dirname "$state")" && echo "$sum" > "$state"
  fi
fi
'''

# Apps opened at login (added to the list, never removed from it)
[bootstrap.macos.login_items]
apps = [
  "/Applications/Maccy.app",
  "/Applications/MonitorControl.app",
  "/Applications/OmniWM.app",
]

# Tap to click, on the built-in and Bluetooth trackpads. macOS also wants
# com.apple.mouse.tapBehavior, for this user and for this Mac (see below).
[bootstrap.macos.trackpad]
tap_to_click = true

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
value = 1
host = "current"

# Ctrl+Space stays free for tmux: no shortcut to change the input source.
# System shortcuts written in full: 60 = previous source (Control+Space),
# 61 = next source (Control+Option+Space)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["60"]
value = { enabled = false, value = { type = "standard", parameters = [32, 49, 262144] } }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["61"]
value = { enabled = false, value = { type = "standard", parameters = [32, 49, 786432] } }

# Control+arrows stay free for the terminal: OmniWM has its own workspaces.
# 32 = Mission Control (Control+Up), 33 = application windows (Control+Down),
# 79 = previous Space (Control+Left), 81 = next Space (Control+Right)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["32"]
value = { enabled = false, value = { type = "standard", parameters = [65535, 126, 8650752] } }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["33"]
value = { enabled = false, value = { type = "standard", parameters = [65535, 125, 8650752] } }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["79"]
value = { enabled = false, value = { type = "standard", parameters = [65535, 123, 8650752] } }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["81"]
value = { enabled = false, value = { type = "standard", parameters = [65535, 124, 8650752] } }

[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 48
autohide = true
"autohide-delay" = 0.0
"autohide-time-modifier" = 0.0
"show-recents" = false
"expose-group-apps" = true

[bootstrap.macos.defaults."com.apple.finder"]
QuitMenuItem = true
AppleShowAllExtensions = true
ShowPathbar = true
FXPreferredViewStyle = "Nlsv"
FXPreferredGroupBy = "Kind"
"_FXSortFoldersFirst" = true
FXDefaultSearchScope = "SCcf"
FXRemoveOldTrashItems = true
FXEnableExtensionChangeWarning = false
"_FXEnableColumnAutoSizing" = true
ShowStatusBar = true
"_FXSortFoldersFirstOnDesktop" = true
ShowHardDrivesOnDesktop = true
ShowExternalHardDrivesOnDesktop = true
ShowRemovableMediaOnDesktop = true
ShowMountedServersOnDesktop = true
CreateDesktop = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "DesktopViewSettings"
path = ["IconViewSettings", "showItemInfo"]
value = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FK_StandardViewSettings"
path = ["IconViewSettings", "showItemInfo"]
value = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "StandardViewSettings"
path = ["IconViewSettings", "showItemInfo"]
value = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "DesktopViewSettings"
path = ["IconViewSettings", "arrangeBy"]
value = "kind"

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FK_StandardViewSettings"
path = ["IconViewSettings", "arrangeBy"]
value = "kind"

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "StandardViewSettings"
path = ["IconViewSettings", "arrangeBy"]
value = "kind"

[bootstrap.macos.defaults."NSGlobalDomain"]
"com.apple.mouse.tapBehavior" = 1
NSDocumentSaveNewDocumentsToCloud = false
NSToolbarTitleViewRolloverDelay = 0.0
ApplePressAndHoldEnabled = false
AppleKeyboardUIMode = 2
InitialKeyRepeat = 12
KeyRepeat = 2

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
DateFormat = "EEE d MMM HH:mm:ss"

# No widgets on the desktop or in Stage Manager, and clicking the wallpaper
# does not move the windows away to show them
[bootstrap.macos.defaults."com.apple.WindowManager"]
StandardHideWidgets = true
StageManagerHideWidgets = true
EnableStandardClickToShowDesktop = false

[bootstrap.macos.defaults."com.apple.TextEdit"]
RichText = 0
SmartQuotes = false
